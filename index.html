<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Logística Pro - SAP EWM</title>
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
    <div class="app-container">
        <!-- Barra de Progreso Global -->
        <header class="top-header">
            <div class="brand">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--cyan)" stroke-width="2">
                    <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                    <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                    <line x1="12" y1="22.08" x2="12" y2="12"></line>
                </svg>
                <div class="brand-text">
                    <h1>LOGÍSTICA PRO</h1>
                    <span>S/4HANA & EWM</span>
                </div>
            </div>
            <div class="progress-container">
                <div class="progress-bar-bg"><div class="progress-bar" id="progress-bar"></div></div>
                <span class="progress-text" id="progress-text">0%</span>
            </div>
        </header>

        <!-- Contenedor Dinámico de Vistas -->
        <main class="view-container" id="view-container">
            <!-- UI Renderer inyectará aquí -->
        </main>

        <!-- Menú de Navegación Inferior Estilo Nativo -->
        <nav class="bottom-nav">
            <button class="nav-btn active" id="nav-academy">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                </svg>
                <span>Academia</span>
            </button>
            <button class="nav-btn" id="nav-glossary">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="16" x2="12" y2="12"></line>
                    <line x1="12" y1="8" x2="12.01" y2="8"></line>
                </svg>
                <span>T-Codes</span>
            </button>
            <button class="nav-btn" id="nav-profile">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <span>Perfil/Backup</span>
            </button>
        </nav>
    </div>

    <!-- Overlay Global (Simulador SAP y Alertas) -->
    <div id="global-overlay" class="overlay hidden">
        <div class="modal-box">
            <button class="close-btn" id="close-modal-btn">✕ CERRAR TERMINAL</button>
            <div id="modal-content"></div>
        </div>
    </div>

    <!-- Orden Estricto de Carga (Arquitectura MVC) -->
    <script src="js/data/syllabus.js"></script>
    <script src="js/core/audio.js"></script>
    <script src="js/core/state.js"></script>
    <script src="js/components/ui-render.js"></script>
    <script src="js/simulators/sap-engine.js"></script>
    <script src="js/core/router.js"></script>
</body>
</html>
