<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#050B14">
    <title>Logística Pro | WMS Architecture</title>
    
    <!-- Fuentes Premium -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    
    <!-- Arquitectura CSS Modular -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/sap-theme.css">
</head>
<body>
    <div id="app-root" class="app-frame">
        <!-- El Header fijo -->
        <header class="top-header">
            <div class="brand">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--cyan)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                <div class="brand-text">
                    <h1>LOGÍSTICA PRO</h1>
                    <span>S/4HANA & EWM</span>
                </div>
            </div>
            <div class="global-progress">
                <span id="progress-text">0%</span>
                <div class="progress-track"><div id="progress-bar" class="progress-fill"></div></div>
            </div>
        </header>

        <!-- Contenedor Dinámico (SPA) -->
        <main id="view-container" class="scroll-area">
            <!-- El contenido se inyectará aquí vía JS -->
        </main>

        <!-- Menú de Navegación Inferior (Estilo App Nativa) -->
        <nav class="bottom-nav">
            <button class="nav-btn active" id="nav-academy">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
                <span>Academia</span>
            </button>
            
            <button class="nav-btn" id="nav-glossary">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                <span>T-Codes</span>
            </button>

            <!-- NUEVO BOTÓN DE PERFIL Y BACKUPS -->
            <button class="nav-btn" id="nav-profile">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                <span>Perfil/Backup</span>
            </button>
        </nav>


        <!-- Overlay Global (Modales y SAP GUI) -->
        <div id="global-overlay" class="overlay hidden">
            <div class="modal-container">
                <button id="close-modal-btn" class="modal-close">×</button>
                <div id="modal-content" class="modal-scroll-area"></div>
            </div>
        </div>
    </div>

    <!-- Arquitectura JS Modular -->
    <script src="js/data/syllabus.js"></script>
    <script src="js/core/audio.js"></script>
    <script src="js/core/state.js"></script>
    <script src="js/simulators/sap-engine.js"></script>
    <script src="js/components/ui-render.js"></script>
    <script src="js/core/router.js"></script>
</body>
</html>
