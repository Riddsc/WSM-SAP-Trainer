<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Logística Pro · Maestría SAP</title>
    <meta name="theme-color" content="#0A1F26">
    <link rel="stylesheet" href="css/components.css?v=6.0">
</head>
<body>
    <div class="app">
        <!-- Cada pantalla se dibuja aquí -->
        <main id="view-container" tabindex="-1"></main>

        <!-- Menú inferior -->
        <nav class="bottom-nav" aria-label="Navegación principal">
            <button class="nav-btn active" id="nav-academy" type="button" aria-current="page">
                <span class="nav-icono"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15M15 6v15"/></svg></span>
                Mapa
            </button>
            <button class="nav-btn" id="nav-review" type="button">
                <span class="nav-icono"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/></svg></span>
                Repaso
            </button>
            <button class="nav-btn" id="nav-glossary" type="button">
                <span class="nav-icono"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M13 15h4"/></svg></span>
                Transacciones
            </button>
            <button class="nav-btn" id="nav-profile" type="button">
                <span class="nav-icono"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></svg></span>
                Perfil
            </button>
        </nav>
    </div>

    <!-- Apuntes: hoja que sube desde abajo -->
    <div class="hoja-fondo" id="notes-backdrop"></div>
    <section id="notes-overlay" class="notes-hidden" role="dialog" aria-modal="true" aria-labelledby="notes-title" aria-hidden="true">
        <div class="notes-header">
            <h2 id="notes-title">Mis apuntes</h2>
            <button id="notes-close-btn" class="btn-icono sin-borde" aria-label="Cerrar apuntes" type="button">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
        </div>
        <p class="notes-context" id="notes-context-title">Apuntes generales</p>
        <div class="notes-body">
            <label for="notes-textarea" class="sr-only">Texto de los apuntes</label>
            <textarea id="notes-textarea" placeholder="Escribe tus notas aquí. Se guardan solas en este celular." spellcheck="true"></textarea>
        </div>
        <div class="notes-footer">
            <span id="notes-save-status" class="save-status" role="status">Guardado</span>
            <button id="notes-export-btn" class="btn btn-secundario btn-chico" type="button">Exportar como texto</button>
        </div>
    </section>

    <!-- Avisos cortos de los robots -->
    <div id="aviso" role="status" aria-live="polite"></div>

    <!-- Orden de carga: versión, datos y núcleo primero; pantallas y navegación al final -->
    <script src="js/version.js"></script>
    <script src="js/core/content.js?v=6.0"></script>
    <script src="js/core/native.js?v=6.0"></script>
    <script src="js/core/audio.js?v=6.0"></script>
    <script src="js/core/state.js?v=6.0"></script>
    <script src="js/components/robots.js?v=6.0"></script>
    <script src="js/components/iconos.js?v=6.0"></script>
    <script src="js/components/ui-render.js?v=6.0"></script>
    <script src="js/simulators/sap-engine.js?v=6.0"></script>
    <script src="js/core/router.js?v=6.0"></script>
</body>
</html>
