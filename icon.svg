<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
    <!-- Fondo Corporativo Oscuro -->
    <rect width="1024" height="1024" fill="#0A0F1C" />
    
    <!-- División Diagonal y Red de Circuitos -->
    <polygon points="1024,0 1024,1024 0,1024" fill="#111827" />
    <line x1="0" y1="1024" x2="1024" y2="0" stroke="#06B6D4" stroke-width="6" opacity="0.4" />

    <!-- 1. LADO IZQUIERDO: MECHARIDDS (Foco Científico) -->
    <g transform="translate(60, 160)">
        <!-- Orejas con Candongas Negras -->
        <circle cx="150" cy="270" r="18" fill="none" stroke="#111" stroke-width="8" />
        <circle cx="150" cy="270" r="12" fill="none" stroke="#000" stroke-width="4" />
        <circle cx="410" cy="270" r="18" fill="none" stroke="#111" stroke-width="8" />
        
        <!-- Antena -->
        <rect x="270" y="40" width="16" height="60" fill="#adb5bd" />
        <circle cx="278" cy="30" r="15" fill="#06B6D4" />

        <!-- Cabeza Robotizada -->
        <rect x="160" y="100" width="240" height="230" rx="45" fill="#e2e8f0" stroke="#475569" stroke-width="6" />
        <rect x="180" y="120" width="200" height="110" rx="15" fill="#cbd5e1" />

        <!-- Gafitas Científicas de Montura Gruesa con lentes Cyan -->
        <rect x="190" y="165" width="80" height="60" rx="12" fill="none" stroke="#334155" stroke-width="12" />
        <rect x="194" y="169" width="72" height="52" rx="8" fill="#e0f7fa" opacity="0.8" />
        <circle cx="230" cy="195" r="10" fill="#06B6D4" />

        <rect x="290" y="165" width="80" height="60" rx="12" fill="none" stroke="#334155" stroke-width="12" />
        <rect x="294" y="169" width="72" height="52" rx="8" fill="#e0f7fa" opacity="0.8" />
        <circle cx="330" cy="195" r="10" fill="#06B6D4" />
        
        <line x1="270" y1="195" x2="290" y2="195" stroke="#334155" stroke-width="12" stroke-linecap="round" />

        <!-- Ojos y Boca -->
        <circle cx="230" cy="195" r="4" fill="#000" />
        <circle cx="330" cy="195" r="4" fill="#000" />
        <path d="M 240 275 Q 280 295 320 275" fill="none" stroke="#334155" stroke-width="6" stroke-linecap="round" />

        <!-- Cuerpo: Bata de Laboratorio y Corbata -->
        <path d="M 160 330 L 400 330 L 450 560 L 110 560 Z" fill="#f8f9fa" stroke="#cbd5e1" stroke-width="4" />
        <path d="M 230 330 L 280 330 L 290 410 L 220 410 Z" fill="#06B6D4" />
        <path d="M 265 330 L 280 330 L 295 440 L 250 440 Z" fill="#0A0F1C" />
    </g>

    <!-- 2. LADO DERECHO: MECHANIZER (Estilo Girlie) -->
    <g transform="translate(480, 160)">
        <!-- Diadema y Moño Rosa en la Cabeza -->
        <path d="M 210 90 Q 280 40 350 90" fill="none" stroke="#f472b6" stroke-width="18" stroke-linecap="round" />
        <!-- Moño Superior Grande -->
        <path d="M 250 50 C 190 0, 210 110, 280 80 C 350 110, 370 0, 310 50 Z" fill="#ec4899" />
        <circle cx="280" cy="65" r="15" fill="#f472b6" />

        <!-- Cabeza Suave y Rostro -->
        <rect x="160" y="100" width="240" height="230" rx="80" fill="#fff5f5" stroke="#f472b6" stroke-width="6" />
        
        <!-- Ojos con Pestañas y Rubor -->
        <circle cx="220" cy="205" r="6" fill="#000" />
        <path d="M 205 195 Q 220 180 235 195" fill="none" stroke="#000" stroke-width="4" />
        <circle cx="220" cy="205" r="2" fill="#fff" />
        
        <circle cx="340" cy="205" r="6" fill="#000" />
        <path d="M 325 195 Q 340 180 355 195" fill="none" stroke="#000" stroke-width="4" />
        <circle cx="340" cy="205" r="2" fill="#fff" />

        <!-- Mejillas Rosas -->
        <circle cx="205" cy="245" r="14" fill="#fbcfe8" opacity="0.6" />
        <circle cx="355" cy="245" r="14" fill="#fbcfe8" opacity="0.6" />

        <!-- Gafitas Cat-Eye Magenta -->
        <polygon points="175,185 270,185 250,225 190,225" fill="none" stroke="#d81b60" stroke-width="8" />
        <polygon points="385,185 290,185 310,225 370,225" fill="none" stroke="#d81b60" stroke-width="8" />
        <line x1="270" y1="185" x2="290" y2="185" stroke="#d81b60" stroke-width="8" />

        <!-- Boca -->
        <path d="M 255 270 Q 280 290 305 270" fill="none" stroke="#ec4899" stroke-width="6" stroke-linecap="round" />

        <!-- Bata de Laboratorio Científica con detalles rosa -->
        <path d="M 175 330 L 385 330 L 435 560 L 125 560 Z" fill="#ffffff" stroke="#fbcfe8" stroke-width="4" />
        <path d="M 260 330 L 300 330 L 310 400 L 250 400 Z" fill="#ec4899" />
        <path d="M 175 330 L 240 460 L 220 460 L 160 330 Z" fill="#fbcfe8" />
        <path d="M 385 330 L 320 460 L 340 460 L 400 330 Z" fill="#fbcfe8" />
    </g>

    <!-- Detalles del Entorno: Circuitos y Brillos -->
    <circle cx="100" cy="100" r="15" fill="#06B6D4" opacity="0.3" />
    <circle cx="924" cy="100" r="20" fill="#ec4899" opacity="0.3" />
    <circle cx="512" cy="740" r="8" fill="#fff" />

    <!-- 3. BRANDING: Logo y Texto Inferior en Cyan brillante -->
    <g transform="translate(0, 780)">
        <rect x="112" y="0" width="800" height="150" rx="30" fill="#111827" stroke="#1F2937" stroke-width="4" />
        <!-- Texto LOGÍSTICA PRO -->
        <text x="512" y="70" font-family="&#39;Impact&#39;, &#39;Arial Black&#39;, sans-serif" font-size="64" font-weight="900" fill="#06B6D4" text-anchor="middle" letter-spacing="4">
            LOGÍSTICA PRO
        </text>
        <!-- Subtexto SAP EWM -->
        <text x="512" y="115" font-family="&#39;Courier New&#39;, monospace, sans-serif" font-size="28" font-weight="bold" fill="#38BDF8" text-anchor="middle" letter-spacing="8">
            S / 4 H A N A   &   E W M
        </text>
    </g>
</svg>
