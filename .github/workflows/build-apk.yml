name: Build Production APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Dependencias
        run: npm install

      - name: Crear Ícono Nativo
        run: |
          mkdir -p assets
          cat << 'EOF' > assets/icon.svg
          <svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
            <rect width="1024" height="1024" fill="#0A192F"/>
            <path d="M512 250L250 400v300l262 150 262-150V400L512 250z" fill="none" stroke="#00F0FF" stroke-width="40"/>
            <path d="M512 250v300 M250 400l262 150 M774 400L512 550" stroke="#00F0FF" stroke-width="40"/>
          </svg>
          EOF
          sudo apt-get update && sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 1024 -h 1024 assets/icon.svg -o assets/icon.png
          cp assets/icon.png assets/splash.png

      - name: Empaquetar Arquitectura Modular y Sincronizar
        run: |
          mkdir -p www
          # Copiamos el HTML principal
          cp index.html www/ 2>/dev/null || :
          # Copiamos las carpetas modulares completas si existen
          [ -d "css" ] && cp -r css www/
          [ -d "js" ] && cp -r js www/
          
          rm -rf android
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Compilar APK Final
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: LogisticaPro-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
