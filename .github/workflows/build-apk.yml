name: Build Production APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Dependencias
        run: npm install

      - name: Crear Ícono Nativo
        run: |
          mkdir -p assets
          echo '<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg"><rect width="1024" height="1024" fill="#0A192F"/><path d="M512 250L250 400v300l262 150 262-150V400L512 250z" fill="none" stroke="#00F0FF" stroke-width="40"/><path d="M512 250v300 M250 400l262 150 M774 400L512 550" stroke="#00F0FF" stroke-width="40"/></svg>' > assets/icon.svg
          sudo apt-get update && sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 1024 -h 1024 assets/icon.svg -o assets/icon.png
          cp assets/icon.png assets/splash.png

      - name: Empaquetar Arquitectura Modular
        run: |
          mkdir -p www
          cp index.html www/ 2>/dev/null || :
          [ -d "css" ] && cp -r css www/
          [ -d "js" ] && cp -r js www/
          rm -rf android
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Generar Llave de Producción
        run: |
          cd android/app
          keytool -genkey -v -keystore logistica.keystore -alias logistica_alias -keyalg RSA -keysize 2048 -validity 10000 -storepass logistica123 -keypass logistica123 -dname "CN=Logistica Pro, OU=Masterclass, O=Logistica, L=Armenia, S=Quindio, C=CO"

      - name: Compilar APK Final (Release Seguro)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -Pandroid.injected.signing.store.file=$(pwd)/app/logistica.keystore -Pandroid.injected.signing.store.password=logistica123 -Pandroid.injected.signing.key.alias=logistica_alias -Pandroid.injected.signing.key.password=logistica123

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: LogisticaPro-App
          path: android/app/build/outputs/apk/release/app-release.apk
