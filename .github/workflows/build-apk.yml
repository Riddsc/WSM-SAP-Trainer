name: Build Production APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Dependencias
        run: npm install

      - name: Empaquetar Arquitectura Modular
        run: |
          mkdir -p www
          cp index.html www/ 2>/dev/null || :
          [ -d "css" ] && cp -r css www/
          [ -d "js" ] && cp -r js www/
          rm -rf android
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Configurar Llave Fija para Actualizaciones (Firma Permanente)
        run: |
          cd android/app
          # Generamos una llave criptográfica fija y automatizada
          keytool -genkey -v -keystore logistica.keystore -alias logistica_alias -keyalg RSA -keysize 2048 -validity 10000 -storepass logistica123 -keypass logistica123 -dname "CN=Logistica Pro, OU=Masterclass, O=Logistica, L=Armenia, S=Quindio, C=CO"
          # Modificamos build.gradle para inyectar la firma al APK Release
          sed -i '/buildTypes {/i \    signingConfigs {\n        release {\n            storeFile file("logistica.keystore")\n            storePassword "logistica123"\n            keyAlias "logistica_alias"\n            keyPassword "logistica123"\n        }\n    }' build.gradle
          sed -i 's/release {/release {\n            signingConfig signingConfigs.release/g' build.gradle

      - name: Compilar APK Final (Release)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: LogisticaPro-App
          # Ahora extraemos la versión Release, firmada y optimizada
          path: android/app/build/outputs/apk/release/app-release.apk
