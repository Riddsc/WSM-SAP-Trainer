name: Build Production APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write # Permite al bot guardar la llave en tu repo

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Crear o Recuperar Llave de Producción (Firma Persistente)
        run: |
          if [ ! -f "logistica.keystore" ]; then
            echo "Llave no encontrada. Generando una nueva y guardándola en el repositorio..."
            keytool -genkey -v -keystore logistica.keystore -alias logistica_alias -keyalg RSA -keysize 2048 -validity 10000 -storepass logistica123 -keypass logistica123 -dname "CN=Logistica Pro, OU=Masterclass, O=Logistica, L=Armenia, S=Quindio, C=CO"
            git config --global user.name "GitHub Actions Bot"
            git config --global user.email "actions@github.com"
            git add logistica.keystore
            git commit -m "🔐 Guardar llave de producción persistente"
            git push
          else
            echo "Llave persistente encontrada. Usando la existente para garantizar actualizaciones sobre la misma app."
          fi

      - name: Instalar Dependencias
        run: npm install

      - name: Crear Ícono Nativo
        run: |
          mkdir -p assets
          cp icon.svg assets/icon.svg
          sudo apt-get update && sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 1024 -h 1024 assets/icon.svg -o assets/icon.png
          cp assets/icon.png assets/splash.png

      - name: Empaquetar Arquitectura Modular
        run: |
          mkdir -p www
          cp index.html www/ 2>/dev/null || :
          [ -d "css" ] && cp -r css www/
          [ -d "js" ] && cp -r js www/
          rm -rf android
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Compilar APK Final (Release Seguro)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -Pandroid.injected.signing.store.file=${{ github.workspace }}/logistica.keystore -Pandroid.injected.signing.store.password=logistica123 -Pandroid.injected.signing.key.alias=logistica_alias -Pandroid.injected.signing.key.password=logistica123

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: LogisticaPro-App
          path: android/app/build/outputs/apk/release/app-release.apk
