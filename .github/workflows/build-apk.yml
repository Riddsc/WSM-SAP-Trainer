name: Construir APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Solo lectura: el flujo ya no guarda nada en el repositorio.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      APP_VERSION_NAME: "2.0.${{ github.run_number }}"
      APP_VERSION_CODE: "${{ github.run_number }}"

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v5

      - name: Preparar Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Preparar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar dependencias
        run: npm install

      - name: Revisar el contenido de los cursos
        run: npm run validar

      - name: Crear el ícono nativo
        run: |
          mkdir -p assets
          sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin
          rsvg-convert -w 1024 -h 1024 icon.svg -o assets/icon.png
          cp assets/icon.png assets/splash.png

      - name: Empaquetar la app web
        run: |
          rm -rf www && mkdir -p www
          cp index.html icon.svg www/
          cp -r css js content www/
          echo "window.APP_VERSION = '${APP_VERSION_NAME}';" > www/js/version.js

      - name: Generar el proyecto Android
        run: |
          rm -rf android
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android
          # Número de versión único en cada APK
          sed -i -E "s/versionCode [0-9]+/versionCode ${APP_VERSION_CODE}/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"${APP_VERSION_NAME}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Compilar APK (sin firmar)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Firmar APK con la llave guardada en Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Faltan los Secrets de firma (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD). La app compiló bien, pero no se puede firmar sin ellos."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/firma.keystore"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/alineado.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/firma.keystore" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "LogisticaPro-${APP_VERSION_NAME}.apk" \
            "$RUNNER_TEMP/alineado.apk"
          "$BUILD_TOOLS/apksigner" verify "LogisticaPro-${APP_VERSION_NAME}.apk"
          rm -f "$RUNNER_TEMP/firma.keystore"

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: LogisticaPro-${{ env.APP_VERSION_NAME }}
          path: LogisticaPro-*.apk
